# Tiny Tapeout project information.
#
# This file is what lets the VGA Playground load the project: the playground
# reads info.yaml from the root of a GitHub branch, then fetches each file in
# source_files from src/. The repo keeps this folder in its usual place, so
# the playground loads a branch made from this folder alone
# (scripts/make_playground_branch.sh).
project:
  title:        "Image Slide Puzzle"
  author:       "HexTex"
  discord:      ""
  description:  "A 4x4 sliding puzzle of a picture, drawn live from an image ROM with no framebuffer"
  language:     "Verilog"
  clock_hz:     25175000

  # The 320x240 picture alone is 600 kbit of ROM, which is far more than any
  # Tiny Tapeout tile holds. This design runs in the VGA Playground and on the
  # AX7010; it is not meant to go to silicon.
  tiles: "1x1"

  top_module:  "tt_um_hextex_slidepuzzle"

  source_files:
    - "tt_um_hextex_slidepuzzle.v"
    - "puzzle_core.v"
    - "vga_timing.v"
    - "gamepad_pmod_rx.v"
    - "digit_font.v"

pinout:
  # Inputs
  ui[0]: "up"
  ui[1]: "down"
  ui[2]: "left"
  ui[3]: "right"
  ui[4]: "gamepad latch"
  ui[5]: "gamepad clock"
  ui[6]: "gamepad data"
  ui[7]: "start"

  # Outputs (Tiny VGA)
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
